# ============================================================
# Nginx 反向代理 — 健身系统前端 + API
# 部署时复制到 /etc/nginx/conf.d/fitness.conf 或 nginx.conf 的 http 块内
# ============================================================

upstream fitness_backend {
    # docker-compose 里的 app 服务
    server fitness-app:8765;
    # 多实例时可添加更多:
    # server fitness-app-2:8765;
    keepalive 16;
}

# 限流区域：每个 IP 每秒最多 20 个请求
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# 连接数限制
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name _;

    # 上传大小限制
    client_max_body_size 10m;

    # 安全头
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ========== API 反向代理 ==========
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://fitness_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 超时
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ========== WebSocket ==========
    location /ws/ {
        proxy_pass http://fitness_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # ========== 静态文件 ==========
    location /static/ {
        proxy_pass http://fitness_backend;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ========== 前端页面 ==========
    location / {
        proxy_pass http://fitness_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ========== 健康检查端点 ==========
    location /health {
        access_log off;
        proxy_pass http://fitness_backend/health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }
}
