# ============================================================
# Neo4j 健身知识图谱 — Docker Compose
# 启动: docker compose -f docker-compose.neo4j.yml up -d
# 停止: docker compose -f docker-compose.neo4j.yml down
# 首次启动后访问: http://localhost:7474 (neo4j / fitness123)
# ============================================================

version: "3.8"

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: fitness-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/fitness123
      NEO4J_dbms_memory_heap_max__size: 512m
      NEO4J_dbms_memory_pagecache_size: 256m
      NEO4J_PLUGINS: '["apoc"]'
      # 开启文件导入（批量导入 CSV 用）
      NEO4J_dbms_security_allow__csv__import__from__file__urls: "true"
      NEO4J_dbms_directories_import: /var/lib/neo4j/import
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./tools/import:/var/lib/neo4j/import   # CSV 导入目录
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "fitness123", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  neo4j_data:
  neo4j_logs:
