version: "3.9"

services:
  # ============================================================
  # Nginx 反向代理
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: fitness-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - fitness-net

  # ============================================================
  # FastAPI 应用
  # ============================================================
  app:
    build: .
    container_name: fitness-app
    ports:
      - "8765:8765"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fitness-net

  # ============================================================
  # PostgreSQL 数据库
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: fitness-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: virtual_fitness_agent_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fitness-net

  # ============================================================
  # Redis 缓存
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: fitness-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fitness-net

  # ============================================================
  # Neo4j 图数据库（本地开发用，生产建议用 AuraDB）
  # ============================================================
  neo4j:
    image: neo4j:5.26-community
    container_name: fitness-neo4j
    environment:
      NEO4J_AUTH: neo4j/fitness123
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./tools:/import
    restart: unless-stopped
    networks:
      - fitness-net
    profiles:
      - local-neo4j  # 仅当 docker compose --profile local-neo4j up 时启动

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:

networks:
  fitness-net:
    driver: bridge
